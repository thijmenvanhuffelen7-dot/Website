<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scalvio</title>
<meta name="description" content="Meer omzet uit e-mail en minder handwerk met automatisering en AI, voor webshops. More revenue from email and less manual work for online stores.">
<link rel="alternate" hreflang="nl" href="https://scalvio.nl/nl/">
<link rel="alternate" hreflang="en" href="https://scalvio.nl/en/">
<link rel="alternate" hreflang="x-default" href="https://scalvio.nl/en/">
<meta name="theme-color" content="#0A0A0A">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<script>
  /* Send visitors to their language: Dutch browsers to /nl/, everyone else to /en/.
     On Netlify the _redirects file does this before the page loads; this is the fallback. */
  (function () {
    var langs = navigator.languages || [navigator.language || ''];
    var nl = langs.some(function (l) { return /^nl\b/i.test(l); });
    location.replace(nl ? 'nl/' : 'en/');
  })();
</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<section class="page-head band"><div class="inner">
  <img src="logo-green.webp" alt="Scalvio" width="115" height="28" style="height:28px;width:auto">
  <h1>Kies je taal · Choose your language</h1>
  <div class="actions"><a class="button" href="nl/" hreflang="nl" lang="nl">Nederlands</a><a class="button line" href="en/" hreflang="en" lang="en">English</a></div>
</div></section>
</body>
</html>
